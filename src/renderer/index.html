<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Subtle ambient gradient orbs -->
    <div class="ambient-glow ambient-glow-1" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-2" aria-hidden="true"></div>
    <div class="crt-overlay" id="crt-overlay" aria-hidden="true"></div>

    <!-- Custom Frameless Titlebar + Tab Strip -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <img class="brand-logo" src="../../assets/aether-logo.png" alt="Aether" />
        <span class="brand-name">AETHER</span>
      </div>

      <div class="tabs-container" id="tabs-container" role="tablist" aria-label="Terminal tabs">
        <!-- Tabs rendered dynamically -->
      </div>

      <div class="new-tab-group">
        <button class="icon-btn new-tab-btn" id="btn-new-tab" title="New Tab (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="icon-btn shell-menu-btn" id="btn-shell-menu" title="Choose shell profile">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="shell-dropdown" id="shell-dropdown" hidden>
          <button class="dropdown-item" data-shell="cmd">
            <span class="shell-tag">&gt;_</span>
            <span>Aether Default</span>
          </button>
          <button class="dropdown-item" data-shell="powershell">
            <span class="shell-tag ps">PS</span>
            <span>PowerShell</span>
          </button>
        </div>
      </div>

      <div class="titlebar-spacer"></div>

      <div class="titlebar-actions">
        <button class="theme-pill" id="btn-cycle-theme" title="Cycle theme (click to switch)">
          <span class="theme-pill-dot" id="theme-pill-dot"></span>
          <span id="theme-pill-name">Obsidian Glass</span>
        </button>

        <button class="icon-btn" id="btn-search" title="Find in Terminal (Ctrl+F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <button class="icon-btn" id="btn-settings" title="Appearance Settings (Ctrl+,)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <div class="window-controls">
          <button class="win-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">
            <svg width="11" height="11" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" id="btn-maximize" title="Maximize" aria-label="Maximize">
            <svg id="icon-maximize" width="11" height="11" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <svg id="icon-restore" width="11" height="11" viewBox="0 0 12 12" hidden><path d="M3.5 1.5h6a1 1 0 0 1 1 1v6M2 3.5h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button class="win-btn win-btn-close" id="btn-close" title="Close" aria-label="Close">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Terminal Viewport -->
    <main class="terminal-stage" id="terminal-stage">
      <!-- Floating Ctrl+F Search Bar -->
      <div class="search-bar" id="search-bar" hidden>
        <input type="text" class="search-input" id="search-input" placeholder="Find in terminal..." aria-label="Find in terminal" />
        <button class="search-nav-btn" id="btn-search-prev" title="Previous Match (Shift+Enter)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <button class="search-nav-btn" id="btn-search-next" title="Next Match (Enter)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="search-nav-btn" id="btn-search-close" title="Close (Esc)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <!-- Per-tab terminal panes mounted here -->
    </main>

    <!-- Minimal Zen Status Bar -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="status-badge" id="status-shell">
          <span class="status-live-dot"></span>
          <span id="status-shell-text">Aether</span>
        </span>
        <span class="status-git-pill" id="status-git-pill" hidden title="Current Git branch">
          <svg class="git-branch-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="15"></line>
            <circle cx="18" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <path d="M18 9a9 9 0 0 1-9 9"></path>
          </svg>
          <span id="status-git-branch"></span>
          <span class="git-dirty-dot" id="status-git-dirty" hidden title="Uncommitted changes"></span>
        </span>
      </div>
      <div class="status-right">
        <button class="help-btn" id="btn-help" title="Command Reference & Shortcuts (Ctrl+/)" aria-label="Command Reference">
          ?
        </button>
      </div>
    </footer>

    <!-- Subtle Floating Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Command Reference & Shortcuts Modal (?) -->
    <div class="help-backdrop" id="help-backdrop" hidden>
      <div class="help-modal" id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
        <div class="help-header">
          <div class="help-title-row">
            <img class="help-brand-icon" src="../../assets/aether-logo.png" alt="" />
            <div>
              <h2 id="help-modal-title">Command Reference</h2>
              <p>Click any command to insert it into your active terminal</p>
            </div>
          </div>
          <button class="icon-btn" id="btn-close-help" title="Close (Esc)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="help-search-wrap">
          <svg class="help-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="help-search-input" id="help-search-input" placeholder="Search commands or shortcuts..." />
        </div>

        <div class="help-tabs" id="help-tabs">
          <button class="help-tab active" data-filter="all">All</button>
          <button class="help-tab" data-filter="commands">Commands</button>
          <button class="help-tab" data-filter="shortcuts">Shortcuts</button>
        </div>

        <div class="help-body" id="help-body">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Slide-Over Aesthetic Customizer Drawer -->
    <aside class="customizer-drawer" id="customizer-drawer" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <h2>Appearance</h2>
          <p>Tune themes, typography & glass</p>
        </div>
        <button class="icon-btn" id="btn-close-drawer" title="Close (Esc)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="drawer-body">
        <!-- Theme Presets -->
        <section class="setting-group">
          <label class="setting-label">Theme Preset</label>
          <div class="theme-grid" id="theme-grid">
            <!-- Theme cards rendered dynamically -->
          </div>
        </section>

        <!-- Font Family -->
        <section class="setting-group">
          <label class="setting-label" for="select-font">Font Family</label>
          <select class="setting-select" id="select-font"></select>
        </section>

        <!-- Font Size & Line Height -->
        <section class="setting-group">
          <div class="setting-row">
            <label class="setting-label" for="range-fontsize">Font Size</label>
            <span class="setting-value" id="val-fontsize">14px</span>
          </div>
          <input type="range" class="setting-range" id="range-fontsize" min="11" max="22" step="1" value="14" />
        </section>

        <section class="setting-group">
          <div class="setting-row">
            <label class="setting-label" for="range-lineheight">Line Height</label>
            <span class="setting-value" id="val-lineheight">1.05</span>
          </div>
          <input type="range" class="setting-range" id="range-lineheight" min="1.0" max="1.6" step="0.05" value="1.05" />
        </section>

        <!-- Transparency Toggle & Opacity Slider -->
        <section class="setting-group">
          <label class="toggle-row">
            <span>Window Transparency</span>
            <input type="checkbox" id="toggle-transparency" checked />
            <span class="toggle-switch"></span>
          </label>
          <div class="opacity-control" id="opacity-control">
            <div class="setting-row">
              <label class="setting-label" for="range-opacity">Window Opacity</label>
              <span class="setting-value" id="val-opacity">94%</span>
            </div>
            <input type="range" class="setting-range" id="range-opacity" min="0.72" max="1" step="0.01" value="0.94" />
          </div>
        </section>

        <!-- Cursor Style -->
        <section class="setting-group">
          <label class="setting-label">Cursor Style</label>
          <div class="segmented-control" id="cursor-style-control">
            <button class="seg-btn active" data-cursor="bar">Bar</button>
            <button class="seg-btn" data-cursor="block">Block</button>
            <button class="seg-btn" data-cursor="underline">Line</button>
          </div>
        </section>

        <!-- Default Shell -->
        <section class="setting-group">
          <label class="setting-label">Default Profile</label>
          <div class="segmented-control" id="default-shell-control">
            <button class="seg-btn active" data-default-shell="cmd">Default</button>
            <button class="seg-btn" data-default-shell="powershell">PowerShell</button>
          </div>
        </section>

        <!-- Toggles -->
        <section class="setting-group toggles-group">
          <label class="toggle-row">
            <span>Cursor Blink</span>
            <input type="checkbox" id="toggle-blink" checked />
            <span class="toggle-switch"></span>
          </label>
          <label class="toggle-row">
            <span>CRT Scanlines & Glow</span>
            <input type="checkbox" id="toggle-scanlines" />
            <span class="toggle-switch"></span>
          </label>
          <label class="toggle-row" id="row-explorer-integration" title='Adds "Open in Aether" to right-click menu & lets you type "aether" in File Explorer'>
            <span>File Explorer Integration</span>
            <input type="checkbox" id="toggle-explorer" />
            <span class="toggle-switch"></span>
          </label>
        </section>
      </div>
    </aside>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/@xterm/addon-image/lib/addon-image.js"></script>
  <script src="./themes.js"></script>
  <script src="./app.js"></script>
</body>
</html>
